# 颜色主题 — 切换主题只需改这一行
# 可选: catppuccin-mocha / catppuccin-latte / tokyo-night / everforest-dark
include themes/catppuccin-mocha.conf

#########################################

# 背景透明度
background_opacity 0.5
font_family SpaceMono Nerd Font

# 编程连字（kitty 新版本使用 disable_ligatures 控制；默认即为 never，这里显式声明）
disable_ligatures true

# 终端兼容性设置
term xterm-256color
shell_integration no-rc

# 设置四周边距（单位：像素）
window_padding_width 8
# 修复 SSH / 旧环境退格键问题（发送 ^H）
map ctrl+h send_text all \x08

map ctrl+shift+equal change_font_size all +1
map ctrl+shift+minus change_font_size all -1
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+t launch --type=tab --cwd=current


# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# added by /home/alex/.agent/notify.sh focus fix (20260201_121719)
window_alert_on_bell no
