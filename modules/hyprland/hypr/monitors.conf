# 参考 https://wiki.hyprland.org/Configuring/Monitors/

# monitor = 名称, 分辨率, 偏移, 缩放, 额外参数
# monitor = ,preferred,auto,auto
#
# 由当前 `hyprctl monitors -j` 自动生成（如需重新生成，直接覆盖本文件即可）
# monitor = DP-2, 1920x1080@60, 0x0, 1, transform,1
monitor = HDMI-A-2, 1920x1080@60, 0x0, 1
monitor = HDMI-A-1, 1920x1080@60, 0x1080, 1

workspace = 1,monitor:HDMI-A-1
