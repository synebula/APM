# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# Float rules for system dialogs and popups
windowrule {
    name = open-files-dialog
    match:title = ^(Open [Ff]iles?)
    float = true
    center = true
}

windowrule {
    name = open-files-dialog-cn
    match:title = ^(打开?)
    float = true
    center = true
}

windowrule {
    name = open-folder-dialog
    match:title = ^(Open [Ff]older)
    float = true
    center = true
}

windowrule {
    name = save-file-dialog
    match:title = ^(Save [Ff]ile)
    float = true
    center = true
}

windowrule {
    name = save-as-dialog
    match:title = ^(Save [Aa]s)
    float = true
    center = true
}

windowrule {
    name = wechat-preview
    match:class = ^(wechat)$
    match:title = ^(预览)$
    float = true
    center = true
}

windowrule {
    name = wechat-media
    match:class = ^(wechat)$
    match:title = ^(图片和视频)$
    center = true
}

windowrule {
    name = location-dialog
    match:title = ^(Location)$
    center = true
}

windowrule {
    name = vscode-center
    match:class = ^(Code)$
    center = true
}

windowrule {
    name = pavucontrol-float
    match:class = ^(org.pulseaudio.pavucontrol)$
    float = true
    opacity = 0.80 0.70
}

windowrule {
    name = blueman-float
    match:class = ^(blueman-manager)$
    float = true
    opacity = 0.80 0.70
}

windowrule {
    name = code-opacity
    match:class = ^(code)$
    opacity = 1.00 1.00
}

windowrule {
    name = code-url-handler-opacity
    match:class = ^(code-url-handler)$
    opacity = 0.80 0.80
}

# Edge (Wayland) tooltips: short-lived empty class/title toplevels cause tiling reflow/flicker.
# Client bug in Edge's Wayland popup path; float + no initial focus mitigates layout flash.
# May also match other empty-class transients — remove if it misbehaves.
# Two variants: full empty (class+title+initial_*) and class+title only.
windowrule {
    name = empty-class-tooltip-float
    match:class = ^$
    match:title = ^$
    match:initial_class = ^$
    match:initial_title = ^$
    float = true
    no_initial_focus = true
    no_focus = true
}

windowrule {
    name = empty-class-title-tooltip-float
    match:class = ^$
    match:title = ^$
    float = true
    no_initial_focus = true
    no_focus = true
}
