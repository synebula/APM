# 包组文件: 经 @include 显式引入才生效, 注释即停用
@include apm.d/base.conf
@include apm.d/gnome.conf

# 配置脚本: 目录引用 = 启用其下全部脚本（按文件名序执行）;
# 也可逐文件引用, 如 @include conf.d/ssh.sh
@include conf.d/

# 安装前准备脚本（源配置、密钥导入等, 在 apply 升级前执行）:
@prepare pre.d/

